<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="30%" stop-color="#E5CFA0"/>
      <stop offset="70%" stop-color="#D6BD86"/>
      <stop offset="100%" stop-color="#A88B50"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Ethereal Halo Glow Filter -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#202329" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Rounded Background Tile -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" stroke="#E9E7E2" stroke-width="2" filter="url(#subtleShadow)"/>

  <!-- Celestial Astrolabe / Orbital Rings -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#D6BD86" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3, 6"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#silverGrad)" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Cardinal Celestial Diamonds -->
  <polygon points="250,30 254,40 250,50 246,40" fill="#D6BD86"/>
  <polygon points="250,450 254,460 250,470 246,460" fill="#D6BD86"/>
  <polygon points="30,250 40,254 50,250 40,246" fill="#D6BD86"/>
  <polygon points="450,250 460,254 470,250 460,246" fill="#D6BD86"/>

  <!-- Luminous Halo Crown at Top -->
  <ellipse cx="250" cy="115" rx="75" ry="18" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#haloGlow)" opacity="0.95"/>
  <ellipse cx="250" cy="115" rx="60" ry="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

  <!-- Zenith 8-Pointed Celestial Star -->
  <g transform="translate(250, 95)">
    <polygon points="0,-18 3,-5 16,0 3,5 0,18 -3,5 -16,0 -3,-5" fill="url(#goldGrad)" filter="url(#haloGlow)"/>
    <polygon points="0,-12 2,-3 11,0 2,3 0,12 -2,3 -11,0 -2,-3" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2" fill="#D6BD86"/>
  </g>

  <!-- Winged Laurel Curves (Minimalist Celestial Feather Accents) -->
  <path d="M 125,290 C 110,250 120,190 155,150 C 145,175 145,215 160,245 Z" fill="url(#silverGrad)" opacity="0.4"/>
  <path d="M 375,290 C 390,250 380,190 345,150 C 355,175 355,215 340,245 Z" fill="url(#silverGrad)" opacity="0.4"/>

  <!-- NY Architectural Monogram -->
  <!-- Letter 'N' -->
  <g id="letterN">
    <!-- Left Stem -->
    <rect x="165" y="160" width="14" height="180" rx="3" fill="url(#goldGrad)"/>
    <!-- Left Serif Top/Bottom -->
    <path d="M 155,160 L 189,160 L 189,165 L 155,165 Z" fill="url(#goldGrad)"/>
    <path d="M 155,335 L 189,335 L 189,340 L 155,340 Z" fill="url(#goldGrad)"/>
    <!-- Right Stem -->
    <rect x="245" y="160" width="14" height="180" rx="3" fill="url(#goldGrad)"/>
    <!-- Diagonal Stroke -->
    <polygon points="167,162 181,162 257,338 243,338" fill="url(#goldGrad)"/>
  </g>

  <!-- Letter 'Y' - Interlocking & Architectural -->
  <g id="letterY">
    <!-- Left Branch of Y -->
    <polygon points="270,160 286,160 325,242 309,242" fill="url(#silverGrad)"/>
    <!-- Right Branch of Y -->
    <polygon points="355,160 339,160 300,242 316,242" fill="url(#silverGrad)"/>
    <!-- Serifs for Top of Y -->
    <path d="M 263,160 L 292,160 L 292,164 L 263,164 Z" fill="url(#silverGrad)"/>
    <path d="M 333,160 L 362,160 L 362,164 L 333,164 Z" fill="url(#silverGrad)"/>
    <!-- Vertical Tail of Y -->
    <rect x="306" y="240" width="14" height="100" rx="3" fill="url(#silverGrad)"/>
    <!-- Bottom Serif for Y -->
    <path d="M 296,336 L 330,336 L 330,340 L 296,340 Z" fill="url(#silverGrad)"/>
  </g>

  <!-- Intersecting Celestial Sparkle in Monogram -->
  <g transform="translate(262, 245)">
    <polygon points="0,-10 2,-3 9,0 2,3 0,10 -2,3 -9,0 -2,-3" fill="#FFFFFF" filter="url(#haloGlow)"/>
  </g>

  <!-- Lower Brand Identity Text -->
  <text x="250" y="395" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', 'Georgia', serif" font-size="20" font-weight="600" letter-spacing="8" fill="#202329">DIVINE ENGINEERING</text>
  <text x="250" y="420" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10.5" font-weight="500" letter-spacing="5" fill="#8B949E">NEELESH YADAV · ARCHITECT</text>
</svg>

