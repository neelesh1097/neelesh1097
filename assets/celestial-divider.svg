<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 42" width="100%" height="42">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#EEF3FA"/>
      <stop offset="50%"  stop-color="#EEF3FA"/>
      <stop offset="88%"  stop-color="#EEF3FA"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D6BD86" stop-opacity="0"/>
      <stop offset="100%" stop-color="#D6BD86" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D6BD86" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D6BD86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="50%" stop-color="#D6BD86"/>
      <stop offset="100%" stop-color="#A88B50"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- EEF3FA celestial pearl-blue background strip -->
  <rect width="900" height="42" fill="url(#bg)"/>

  <!-- Left taper line -->
  <line x1="30" y1="21" x2="408" y2="21" stroke="url(#lineL)" stroke-width="0.9"/>
  <!-- Left small diamond -->
  <polygon points="400,21 404,18.5 408,21 404,23.5" fill="#D6BD86" opacity="0.75"/>

  <!-- Right taper line -->
  <line x1="492" y1="21" x2="870" y2="21" stroke="url(#lineR)" stroke-width="0.9"/>
  <!-- Right small diamond -->
  <polygon points="492,21 488,18.5 484,21 488,23.5" fill="#D6BD86" opacity="0.75"/>

  <!-- Centre celestial motif -->
  <g transform="translate(450,21)">
    <circle cx="0" cy="0" r="14" stroke="url(#starGold)" stroke-width="0.7" fill="none" stroke-dasharray="2,3" opacity="0.6"/>
    <circle cx="0" cy="0" r="9"  stroke="#C8D8EB"      stroke-width="0.6" fill="none"/>
    <!-- 8-point star -->
    <polygon points="0,-13 2.2,-3.3 13,0 2.2,3.3 0,13 -2.2,3.3 -13,0 -2.2,-3.3"
             fill="url(#starGold)" filter="url(#glow)"/>
    <polygon points="0,-7.5 1.4,-1.9 7.5,0 1.4,1.9 0,7.5 -1.4,1.9 -7.5,0 -1.4,-1.9"
             fill="#EEF3FA"/>
    <circle cx="0" cy="0" r="1.5" fill="#D6BD86"/>
  </g>
</svg>
