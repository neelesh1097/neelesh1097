<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="100%" height="36" fill="none">
  <defs>
    <linearGradient id="divLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6BD86" stop-opacity="0"/>
      <stop offset="60%" stop-color="#D6BD86" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D6BD86" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="divRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6BD86" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#D6BD86" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D6BD86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="50%" stop-color="#D6BD86"/>
      <stop offset="100%" stop-color="#A88B50"/>
    </linearGradient>
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Tapered Line -->
  <line x1="50" y1="18" x2="410" y2="18" stroke="url(#divLeft)" stroke-width="1"/>
  <circle cx="390" cy="18" r="1.5" fill="#D6BD86" opacity="0.7"/>
  <polygon points="405,18 408,16 411,18 408,20" fill="#D6BD86" opacity="0.8"/>

  <!-- Right Tapered Line -->
  <line x1="490" y1="18" x2="850" y2="18" stroke="url(#divRight)" stroke-width="1"/>
  <circle cx="510" cy="18" r="1.5" fill="#D6BD86" opacity="0.7"/>
  <polygon points="495,18 492,16 489,18 492,20" fill="#D6BD86" opacity="0.8"/>

  <!-- Center Celestial Motif -->
  <g transform="translate(450, 18)">
    <!-- Outer Halo Ring -->
    <circle cx="0" cy="0" r="13" stroke="url(#divGold)" stroke-width="0.8" opacity="0.7" stroke-dasharray="2, 2"/>
    <circle cx="0" cy="0" r="9" stroke="#E9E7E2" stroke-width="0.6" opacity="0.9"/>
    
    <!-- 8-Pointed Celestial Star -->
    <polygon points="0,-14 2.5,-3.5 13,0 2.5,3.5 0,14 -2.5,3.5 -13,0 -2.5,-3.5" fill="url(#divGold)" filter="url(#divGlow)"/>
    <polygon points="0,-8 1.5,-2 8,0 1.5,2 0,8 -1.5,2 -8,0 -1.5,-2" fill="#FFFFFF"/>
    
    <!-- Core Spark -->
    <circle cx="0" cy="0" r="1.5" fill="#D6BD86"/>
  </g>
</svg>

